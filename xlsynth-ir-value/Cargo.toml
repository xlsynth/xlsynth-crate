[package]
name = "xlsynth-ir-value"
version = "0.74.0"
edition = "2024"
authors = ["Christopher D. Leary <cdleary@gmail.com>"]
description = "Native Rust values and types for XLS IR"
license = "Apache-2.0"
repository = "https://github.com/xlsynth/xlsynth-crate"
documentation = "https://docs.rs/xlsynth-ir-value"

[lints]
workspace = true

[dependencies]
num-bigint = "0.4.6"
serde_json = "1.0"
smallvec = "1.13.2"

[dev-dependencies]
rand = "0.8"
tempfile = "3.20"

[lib]
name = "xlsynth_ir_value"
path = "src/lib.rs"
