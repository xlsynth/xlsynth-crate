[package]
name = "xlsynth-lean"
version = "0.76.0"
edition = "2024"
authors = ["Christopher D. Leary <cdleary@gmail.com>"]
description = "Export XLSynth gate graphs and block IR to Lean"
license = "Apache-2.0"
repository = "https://github.com/xlsynth/xlsynth-crate"
documentation = "https://docs.rs/xlsynth-lean"

[lints]
workspace = true

[dependencies]
anyhow = "1"
xlsynth-pir = { path = "../xlsynth-pir", version = "0.76.0" }
xlsynth-g8r = { path = "../xlsynth-g8r", version = "0.76.0" }
xlsynth-ir-value = { path = "../xlsynth-ir-value", version = "0.76.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
thiserror.workspace = true

[dev-dependencies]
pretty_assertions = "1.4.1"

[lib]
name = "xlsynth_lean"
path = "src/lib.rs"
