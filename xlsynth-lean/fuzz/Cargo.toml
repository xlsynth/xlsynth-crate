[package]
name = "xlsynth-lean-fuzz"
version = "0.85.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[lints]
workspace = true

[dependencies]
anyhow = "1"
blake3 = "1"
libfuzzer-sys = "0.4"
rand = "0.8"
tempfile = "3.20"
xlsynth = { path = "../../xlsynth", version = "0.85.0" }
xlsynth-g8r = { path = "../../xlsynth-g8r", version = "0.85.0" }
xlsynth-ir-value = { path = "../../xlsynth-ir-value", version = "0.85.0" }
xlsynth-lean = { path = "..", version = "0.85.0" }
xlsynth-pir = { path = "../../xlsynth-pir", version = "0.85.0" }

[features]
external-lean = []

[workspace]
members = ["."]

[workspace.lints.rust]
warnings = "deny"

[[bin]]
name = "fuzz_gate_fn_lean_eval"
path = "fuzz_targets/fuzz_gate_fn_lean_eval.rs"
test = false
doc = false
required-features = ["external-lean"]

[[bin]]
name = "fuzz_dslx_parametric_calls"
path = "fuzz_targets/fuzz_dslx_parametric_calls.rs"
test = false
doc = false
required-features = ["external-lean"]

[[bin]]
name = "fuzz_ir_fn_lean_eval"
path = "fuzz_targets/fuzz_ir_fn_lean_eval.rs"
test = false
doc = false
required-features = ["external-lean"]

[[bin]]
name = "fuzz_block_lean_eval"
path = "fuzz_targets/fuzz_block_lean_eval.rs"
test = false
doc = false
required-features = ["external-lean"]
