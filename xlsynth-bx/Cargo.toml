[package]
name = "xlsynth-bx"
version = "0.82.0"
edition = "2024"
authors = ["Christopher D. Leary <cdleary@gmail.com>"]
description = "A DSLX-like frontend for XLS block IR"
license = "Apache-2.0"
repository = "https://github.com/xlsynth/xlsynth-crate"
documentation = "https://docs.rs/xlsynth-bx"

[lints]
workspace = true

[dependencies]
annotate-snippets = "=0.12.16"
num-bigint = "0.4.6"
petgraph = { version = "0.8.3", default-features = false, features = ["graphmap", "std"] }
rand = "0.8"
rand_pcg = "0.3.1"
stacker = "0.1.25"
tempfile = "3.20"
xlsynth = { path = "../xlsynth", version = "0.82.0" }
xlsynth-codegen = { path = "../xlsynth-codegen", version = "0.82.0" }
xlsynth-pir = { path = "../xlsynth-pir", version = "0.82.0" }
xlsynth-vastly = { path = "../xlsynth-vastly", version = "0.82.0" }
