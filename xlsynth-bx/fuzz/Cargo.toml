[package]
name = "xlsynth-bx-fuzz"
version = "0.85.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
tempfile = "3.20"
xlsynth = { path = "../../xlsynth", version = "0.85.0" }
xlsynth-bx = { path = "..", version = "0.85.0" }
xlsynth-pir = { path = "../../xlsynth-pir", version = "0.85.0" }

[workspace]
