// Regenerate the checked-in descriptor with protoc 28.0-rc3 from this directory:
// protoc --include_source_info --descriptor_set_out=case.bin case.proto
syntax = "proto2";

package xlsynth.mffc_regressions;

// Absolute bounds on the mapped result, with tolerance in profile.json.
message Limits {
  required uint64 and_nodes_max = 1;
  required double graph_le_max = 2;
  required uint64 depth_max = 3;
}

// Shift cases also compare their optimized result with the fixed input.
message ShiftExpectations {
  required bool require_improvement = 1;
  required Limits limits = 2;
}

// Split-adder cases measure both settings of the recovery option.
message SplitAdderExpectations {
  required Limits disabled_limits = 1;
  required Limits enabled_limits = 2;
  optional string same_as = 3;
}

// The filename supplies the case name; the paired IR supplies its top function.
message Case {
  required string sha256 = 1;
  oneof expectations {
    ShiftExpectations shift = 2;
    SplitAdderExpectations split_adder = 3;
  }
}
