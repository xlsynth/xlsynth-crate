// Regenerate the checked-in descriptor with protoc 3.21.12 from this directory:
// protoc --include_source_info --descriptor_set_out=provenance.bin provenance.proto
syntax = "proto2";

package xlsynth.priority_result;

// Records the archive and tool versions used when these fixtures were captured.
message Provenance {
  required uint32 schema_version = 1;
  required string crate_version = 2;
  required string dso_version = 3;
  required string site = 4;
  repeated Sample samples = 5;
  repeated SyntheticControl synthetic_controls = 6;
}

// Preserves the source action and extraction identity for an archived IR sample.
message Sample {
  required string file = 1;
  required string source = 2;
  required string source_action_id = 3;
  required string extracted_action_id = 4;
  required string fixture_sha256 = 5;
  // The structural hash recorded by the pinned crate version, not current code.
  required string computed_structural_hash = 6;
}

// Pins a synthetic control to the exact checked-in IR bytes.
message SyntheticControl {
  required string file = 1;
  required string sha256 = 2;
}
