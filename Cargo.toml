[workspace]
members = [
    "xlsynth",
    "xlsynth-sys",
    "xlsynth-mcmc",
    "xlsynth-mcmc-pir",
    "xlsynth-driver",
    "xlsynth-estimator",
    "xlsynth-codegen",
    "xlsynth-g8r",
    "xlsynth-pir-compiler-runtime",
    "xlsynth-pir-compiler",
    "xlsynth-pir-compiler/tests/aot-dslx-test-crate",
    "xlsynth-pir-compiler/tests/aot-ir-test-crate",
    "xlsynth-pir",
    "xlsynth-prover",
    "xlsynth-autocov",
    "xlsynth-vast",
    "xlsynth-vastly",
    "xlsynth-dslx-routines",
    "sample-usage",
]
resolver = "2"

[workspace.dependencies]
colored = "3.0.0"
criterion = "0.5"
flate2 = { version = "1.1.9", default-features = false, features = ["zlib-rs"] }
thiserror = "2"
toml = "0.8.19"
which = "7.0.3"

[workspace.lints.rust]
warnings = "deny"
